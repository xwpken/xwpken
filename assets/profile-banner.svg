<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Weipeng Xu — chalkboard sketch</title>
  <desc id="desc">A hand-drawn chalkboard research profile banner</desc>
  <defs>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/></filter>
    <filter id="board"><feTurbulence type="fractalNoise" baseFrequency=".3" numOctaves="3" seed="15" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer><feBlend in="SourceGraphic" mode="screen"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="26"/></clipPath>
    <style>
      .edge{stroke-dasharray:12 7;animation:dash 6s linear infinite}
      .node{animation:blink 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .node:nth-child(3n+1){animation-delay:-1s}.node:nth-child(3n+2){animation-delay:-2s}
      .element-a,.element-b,.element-c,.element-d{animation:float 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .element-b{animation-delay:-1.1s}.element-c{animation-delay:-2.2s}.element-d{animation-delay:-3.3s}
      .face{animation:face 3.4s ease-in-out infinite}.face-b{animation-delay:-1.7s}
      @keyframes dash{to{stroke-dashoffset:-114}}
      @keyframes blink{50%{opacity:.42;transform:scale(.72)}}
      @keyframes float{50%{transform:translateY(-7px) rotate(1.2deg)}}
      @keyframes face{50%{fill-opacity:.28}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#173B37" filter="url(#board)"/>
    <path d="M0 326C242 315 421 344 650 322C864 302 1051 334 1200 312" fill="none" stroke="#E8DDC3" stroke-opacity=".1" stroke-width="3" filter="url(#chalk)"/>
    <g font-family="'Comic Sans MS','Bradley Hand',cursive" filter="url(#chalk)">
      <text x="72" y="79" fill="#F3C969" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3.1">DIFFERENTIABLE PHYSICS · COMPUTATIONAL MECHANICS</text>
      <text x="68" y="184" fill="#F4EBD8" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700">Weipeng Xu</text>
      <text x="72" y="257" fill="#F0E6CF" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22">PhD Candidate in Civil Engineering at HKUST</text>
    </g>

    <!-- A small hand-drawn catalogue of common 2D and 3D finite elements. -->
    <g transform="translate(720 46)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#chalk)">
      <text x="26" y="24" fill="#7DD3FC" stroke="none" font-family="'Comic Sans MS',cursive" font-size="16">2D</text>
      <text x="286" y="24" fill="#EF8C7F" stroke="none" font-family="'Comic Sans MS',cursive" font-size="16">3D</text>

      <!-- TRI3 -->
      <g transform="translate(18 38)"><g class="element-a">
        <path class="face" d="M8 79L55 4L105 78Z" fill="#7DD3FC" fill-opacity=".1" stroke="none"/>
        <path class="edge" d="M8 79L55 4L105 78Z" stroke="#F4EBD8" stroke-width="2.2"/>
        <g fill="#F4EBD8" stroke="none"><circle class="node" cx="8" cy="79" r="4"/><circle class="node" cx="55" cy="4" r="4"/><circle class="node" cx="105" cy="78" r="4"/></g>
        <text x="37" y="102" fill="#7DD3FC" stroke="none" font-family="'Comic Sans MS',cursive" font-size="14">TRI3</text>
      </g></g>

      <!-- QUAD4 -->
      <g transform="translate(130 40)"><g class="element-b">
        <path class="face face-b" d="M5 10L98 2L91 80L14 75Z" fill="#7DD3FC" fill-opacity=".08" stroke="none"/>
        <path class="edge" d="M5 10L98 2L91 80L14 75Z" stroke="#F4EBD8" stroke-width="2.2"/>
        <g fill="#F4EBD8" stroke="none"><circle class="node" cx="5" cy="10" r="4"/><circle class="node" cx="98" cy="2" r="4"/><circle class="node" cx="91" cy="80" r="4"/><circle class="node" cx="14" cy="75" r="4"/></g>
        <text x="32" y="102" fill="#7DD3FC" stroke="none" font-family="'Comic Sans MS',cursive" font-size="14">QUAD4</text>
      </g></g>

      <!-- TET4 -->
      <g transform="translate(237 37)"><g class="element-c">
        <path class="face" d="M8 79L76 82L45 9Z" fill="#EF8C7F" fill-opacity=".08" stroke="none"/>
        <path class="face face-b" d="M45 9L76 82L106 39Z" fill="#EF8C7F" fill-opacity=".055" stroke="none"/>
        <path class="edge" d="M8 79L76 82L45 9ZM45 9L106 39L76 82" stroke="#F4EBD8" stroke-width="2.1"/>
        <path d="M8 79L106 39" stroke="#EF8C7F" stroke-width="1.8" stroke-dasharray="5 6"/>
        <g fill="#F4EBD8" stroke="none"><circle class="node" cx="8" cy="79" r="4"/><circle class="node" cx="76" cy="82" r="4"/><circle class="node" cx="45" cy="9" r="4"/><circle class="node" cx="106" cy="39" r="4"/></g>
        <text x="38" y="102" fill="#EF8C7F" stroke="none" font-family="'Comic Sans MS',cursive" font-size="14">TET4</text>
      </g></g>

      <!-- HEX8 -->
      <g transform="translate(349 34)"><g class="element-d">
        <path class="face face-b" d="M12 28L70 20L91 4L35 10Z" fill="#EF8C7F" fill-opacity=".08" stroke="none"/>
        <path class="edge" d="M12 28L70 20L70 82L12 89ZM35 10L91 4L91 66L35 73ZM12 28L35 10M70 20L91 4M70 82L91 66M12 89L35 73" stroke="#F4EBD8" stroke-width="2.1"/>
        <g fill="#F4EBD8" stroke="none"><circle class="node" cx="12" cy="28" r="3.8"/><circle class="node" cx="70" cy="20" r="3.8"/><circle class="node" cx="70" cy="82" r="3.8"/><circle class="node" cx="12" cy="89" r="3.8"/><circle class="node" cx="35" cy="10" r="3.8"/><circle class="node" cx="91" cy="4" r="3.8"/><circle class="node" cx="91" cy="66" r="3.8"/><circle class="node" cx="35" cy="73" r="3.8"/></g>
        <text x="34" y="108" fill="#EF8C7F" stroke="none" font-family="'Comic Sans MS',cursive" font-size="14">HEX8</text>
      </g></g>

      <path d="M18 171C116 157 184 176 271 164C345 154 387 165 436 157" stroke="#F4EBD8" stroke-opacity=".26" stroke-width="1.6"/>
      <text x="133" y="207" fill="#F4EBD8" stroke="none" font-family="'Comic Sans MS','Bradley Hand',cursive" font-size="22" letter-spacing="1">finite element method</text>
    </g>
  </g>
</svg>
