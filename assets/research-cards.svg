<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Research interests</title>
  <desc id="desc">Differentiable physics, computational mechanics, and inverse design and control</desc>

  <defs>
    <linearGradient id="card-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C213B" />
      <stop offset="1" stop-color="#103C4C" />
    </linearGradient>
    <linearGradient id="card-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C38" />
      <stop offset="1" stop-color="#252653" />
    </linearGradient>
    <linearGradient id="card-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10263A" />
      <stop offset="1" stop-color="#16433E" />
    </linearGradient>
    <linearGradient id="border-a"><stop stop-color="#38BDF8" /><stop offset="1" stop-color="#5EEAD4" /></linearGradient>
    <linearGradient id="border-b"><stop stop-color="#818CF8" /><stop offset="1" stop-color="#C084FC" /></linearGradient>
    <linearGradient id="border-c"><stop stop-color="#2DD4BF" /><stop offset="1" stop-color="#A3E635" /></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".24" />
    </filter>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="clip-a"><rect x="18" y="15" width="372" height="292" rx="24" /></clipPath>
    <clipPath id="clip-b"><rect x="414" y="15" width="372" height="292" rx="24" /></clipPath>
    <clipPath id="clip-c"><rect x="810" y="15" width="372" height="292" rx="24" /></clipPath>
    <style>
      .card { filter: url(#shadow); }
      .edge { stroke-dasharray: 90 1050; stroke-linecap: round; animation: edge-run 7s linear infinite; }
      .edge-b { animation-delay: -2.25s; }
      .edge-c { animation-delay: -4.5s; }
      .icon { animation: float 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .icon-b { animation-delay: -1.4s; }
      .icon-c { animation-delay: -2.8s; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
      .orbit-reverse { animation-direction: reverse; animation-duration: 12s; }
      .mesh-line { stroke-dasharray: 5 7; animation: dash 4s linear infinite; }
      .mesh-node { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .mesh-node:nth-child(2n) { animation-delay: -1.4s; }
      .path { stroke-dasharray: 8 7; animation: dash 3.5s linear infinite; }
      .traveler { animation: traveler 3.5s ease-in-out infinite; }
      .scan { animation: scan 5s ease-in-out infinite; }

      @keyframes edge-run { to { stroke-dashoffset: -1140; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dash { to { stroke-dashoffset: -70; } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.45); } }
      @keyframes traveler { 0%,100% { transform: translate(0,0); } 50% { transform: translate(55px,-35px); } }
      @keyframes scan { 0%,100% { transform: translateX(-80px); opacity: 0; } 20%,80% { opacity: .35; } 50% { transform: translateX(390px); opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Card 1 -->
  <g class="enter-a">
    <rect class="card" x="18" y="15" width="372" height="292" rx="24" fill="url(#card-a)" />
    <rect x="18.75" y="15.75" width="370.5" height="290.5" rx="23.25" fill="none" stroke="#38BDF8" stroke-opacity=".22" stroke-width="1.5" />
    <rect class="edge" x="19" y="16" width="370" height="290" rx="23" fill="none" stroke="url(#border-a)" stroke-width="2.5" />
    <g clip-path="url(#clip-a)"><rect class="scan" x="-120" y="15" width="70" height="292" fill="#67E8F9" opacity=".15" transform="skewX(-15)" /></g>
    <g transform="translate(70 75)" fill="none" stroke="#67E8F9" stroke-width="2">
      <g class="icon">
        <ellipse class="orbit" cx="0" cy="0" rx="35" ry="14" />
        <g transform="rotate(60)"><ellipse class="orbit orbit-reverse" cx="0" cy="0" rx="35" ry="14" /></g>
        <g transform="rotate(120)"><ellipse class="orbit" cx="0" cy="0" rx="35" ry="14" /></g>
        <circle cx="0" cy="0" r="6" fill="#5EEAD4" stroke="none" filter="url(#soft-glow)" />
      </g>
    </g>
    <text x="48" y="149" fill="#F8FAFC" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="700">Differentiable Physics</text>
    <text x="48" y="184" fill="#A9C7D8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15">
      <tspan x="48">End-to-end differentiable simulators</tspan>
      <tspan x="48" dy="23">for analysis, design, and discovery.</tspan>
    </text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="650" letter-spacing=".7">
      <rect x="48" y="244" width="93" height="28" rx="14" fill="#38BDF8" fill-opacity=".12" /><text x="64" y="263" fill="#7DD3FC">AUTODIFF</text>
      <rect x="150" y="244" width="105" height="28" rx="14" fill="#2DD4BF" fill-opacity=".12" /><text x="166" y="263" fill="#5EEAD4">SIMULATION</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g class="enter-b">
    <rect class="card" x="414" y="15" width="372" height="292" rx="24" fill="url(#card-b)" />
    <rect x="414.75" y="15.75" width="370.5" height="290.5" rx="23.25" fill="none" stroke="#818CF8" stroke-opacity=".22" stroke-width="1.5" />
    <rect class="edge edge-b" x="415" y="16" width="370" height="290" rx="23" fill="none" stroke="url(#border-b)" stroke-width="2.5" />
    <g clip-path="url(#clip-b)"><rect class="scan" x="270" y="15" width="70" height="292" fill="#A78BFA" opacity=".12" transform="skewX(-15)" /></g>
    <g transform="translate(466 49)" fill="none" stroke="#A5B4FC" stroke-width="1.5">
      <g class="icon icon-b">
        <path class="mesh-line" d="M0 40L37 6L73 34L62 76L18 73ZM0 40L62 76M37 6L18 73M73 34L18 73" />
        <g fill="#C4B5FD" stroke="none">
          <circle class="mesh-node" cx="0" cy="40" r="3.5"/><circle class="mesh-node" cx="37" cy="6" r="3.5"/>
          <circle class="mesh-node" cx="73" cy="34" r="3.5"/><circle class="mesh-node" cx="62" cy="76" r="3.5"/><circle class="mesh-node" cx="18" cy="73" r="3.5"/>
        </g>
      </g>
    </g>
    <text x="444" y="149" fill="#F8FAFC" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="700">Computational Mechanics</text>
    <text x="444" y="184" fill="#B8B9D9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15">
      <tspan x="444">Finite element methods for nonlinear</tspan>
      <tspan x="444" dy="23">and large-deformation problems.</tspan>
    </text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="650" letter-spacing=".7">
      <rect x="444" y="244" width="67" height="28" rx="14" fill="#818CF8" fill-opacity=".13" /><text x="461" y="263" fill="#A5B4FC">FEM</text>
      <rect x="520" y="244" width="116" height="28" rx="14" fill="#C084FC" fill-opacity=".12" /><text x="536" y="263" fill="#D8B4FE">NONLINEAR</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g class="enter-c">
    <rect class="card" x="810" y="15" width="372" height="292" rx="24" fill="url(#card-c)" />
    <rect x="810.75" y="15.75" width="370.5" height="290.5" rx="23.25" fill="none" stroke="#2DD4BF" stroke-opacity=".22" stroke-width="1.5" />
    <rect class="edge edge-c" x="811" y="16" width="370" height="290" rx="23" fill="none" stroke="url(#border-c)" stroke-width="2.5" />
    <g clip-path="url(#clip-c)"><rect class="scan" x="665" y="15" width="70" height="292" fill="#86EFAC" opacity=".12" transform="skewX(-15)" /></g>
    <g transform="translate(858 54)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g class="icon icon-c">
        <path class="path" d="M4 66C18 22 44 85 70 20" stroke="#5EEAD4" stroke-width="2.2" />
        <path d="M4 76H78M4 76V8" stroke="#94A3B8" stroke-opacity=".55" stroke-width="1.4" />
        <circle class="traveler" cx="15" cy="52" r="5" fill="#A3E635" stroke="#ECFCCB" stroke-width="2" filter="url(#soft-glow)" />
        <path d="M64 12L70 20L61 24" stroke="#A3E635" stroke-width="2" />
      </g>
    </g>
    <text x="840" y="149" fill="#F8FAFC" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="700">Inverse Design &amp; Control</text>
    <text x="840" y="184" fill="#B1CFCA" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15">
      <tspan x="840">Optimization, inference, and learning</tspan>
      <tspan x="840" dy="23">for complex physical systems.</tspan>
    </text>
    <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="650" letter-spacing=".7">
      <rect x="840" y="244" width="117" height="28" rx="14" fill="#2DD4BF" fill-opacity=".12" /><text x="856" y="263" fill="#5EEAD4">OPTIMIZATION</text>
      <rect x="966" y="244" width="85" height="28" rx="14" fill="#A3E635" fill-opacity=".11" /><text x="983" y="263" fill="#BEF264">CONTROL</text>
    </g>
  </g>
</svg>
